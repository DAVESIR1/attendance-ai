# ---------------------------------------------------------------------------
# Attendance AI — Gradle properties
# ---------------------------------------------------------------------------

# AGP options
android.keepArtifactIndexesInBytecode=true
android.useAndroidX=true

# Keep Gradle from re-downloading the toolchain each build
org.gradle.parallel=true

# Dexing the Compose + MediaPipe dependency set needs more than the
# default 512m heap (R8/d8 OOM-ed in mergeExtDexDebug).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Default to JAVA_HOME of the caller if set; otherwise uncomment one of:
# jdk.home=/home/davesir/.jdks/jdk-17.0.20.1+1
