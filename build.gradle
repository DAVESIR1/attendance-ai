plugins {
    id 'com.android.application' version '8.9.1'
}

def modelDir = file('models')

android {
    namespace 'org.attendanceai'

    compileSdk 35

    defaultConfig {
        applicationId 'org.attendanceai.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    // androidx.camera, androidx.activity and MediaPipe Tasks are published on Google Maven
    google()
    // TensorFlow Lite (Java Android) is published on Maven Central
    mavenCentral()
}

dependencies {
    // --- MediaPipe Tasks Face Landmarker (Apache-2.0) -------------------------
    // Runs the face_landmarker.task bundled model completely on-device.
    // Kotlin-based: keep its kotlin-stdlib dependency (transitive alignment
    // below keeps every kotlin-stdlib* artifact on one version so the
    // duplicate-class check passes).
    implementation 'com.google.mediapipe:tasks-vision:1.0.0'

    // --- TensorFlow Lite interpreter for MobileFaceNet embeddings --------------
    // The 2.16.1 pairing ships Android natives (arm64/v7, x86/x64) + the public API.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-api:2.16.1'

    // --- AndroidX --------------------------------------------------------------
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.annotation:annotation:1.2.0'

    // --- Unit tests (run on the host JVM against pure-Java classes) ------------
    testImplementation 'junit:junit:4.13.2'
}

// kotlin-stdlib-jdk7/jdk8 content was merged into kotlin-stdlib in Kotlin 1.8;
// mixed transitive versions produce "Duplicate class kotlin.collections.jdk8…"
// errors. Pin every kotlin-stdlib* artifact to the same release.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
        }
    }
}

// Copy git-tracked model files (when present) into the app assets so they are
// bundled inside the APK. models/ is gitignored for the model binaries; this
// step makes a locally fetched model available to the running app.
task copyModels(type: Copy) {
    from modelDir
    into "$projectDir/src/main/assets"
    include '*.task', '*.tflite'
    onlyIf { modelDir.exists() }
}

preBuild.dependsOn copyModels
