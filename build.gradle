plugins {
    id 'com.android.application' version '8.9.1'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
    id 'org.jetbrains.kotlin.kapt' version '2.0.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
}

def modelDir = file('models')
def arm64Only = project.hasProperty('arm64Only')

// --- Release signing credentials ---------------------------------------------
// Read from local.properties (gitignored) so no password is ever committed in
// build.gradle. The keystore itself lives OUTSIDE the repo. assembleRelease
// refuses to run without these entries instead of producing an unsigned APK.
def releaseProps = new Properties()
def releasePropsFile = rootProject.file('local.properties')
if (releasePropsFile.exists()) {
    releasePropsFile.withInputStream { releaseProps.load(it) }
}
def releaseStoreFile = releaseProps.getProperty('RELEASE_STORE_FILE')
def releaseStorePassword = releaseProps.getProperty('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseProps.getProperty('RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseProps.getProperty('RELEASE_KEY_PASSWORD')
def releaseSigningReady = releaseStoreFile != null && releaseStorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null
if (!releaseSigningReady
        && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('Release build needs RELEASE_STORE_FILE / ' +
            'RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD ' +
            'in local.properties')
}

android {
    namespace 'org.attendanceai'

    compileSdk 35

    defaultConfig {
        applicationId 'org.attendanceai.app'
        // Optional side-by-side test identity:
        //   ./gradlew assembleRelease -PdevAppId
        // builds as org.attendanceai.app.dev, which installs NEXT TO an old
        // conflicting install of org.attendanceai.app (see PROJECT_STATE.md
        // "INSTALL BLOCKER"). Without the flag the app id is unchanged.
        if (project.hasProperty('devAppId')) {
            applicationIdSuffix '.dev'
        }
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.2.1-event-log'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Phone-testing builds target this device only: a single arm64-v8a
        // native slice for both debug and release (smaller APK, and the release
        // package is exactly what gets installed on the phone).
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Real (non-debug) signed release with R8 shrinking/obfuscation.
            // Keep rules live in proguard-rules.pro (Room, MediaPipe, TFLite,
            // SQLCipher, Tink must survive minification — verified by running
            // this build on the phone).
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    // Legacy packaging option: ./gradlew assembleDebug -Parm64Only splits the
    // APK per ABI. defaultConfig.ndk.abiFilters already limits every build to
    // arm64-v8a, so this only adds split packaging on top.
    splits {
        abi {
            enable arm64Only
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

repositories {
    // androidx.camera, androidx.activity and MediaPipe Tasks are published on Google Maven
    google()
    // TensorFlow Lite (Java Android) is published on Maven Central
    mavenCentral()
}

dependencies {
    // --- MediaPipe Tasks Face Landmarker (Apache-2.0) -------------------------
    // Runs the face_landmarker.task bundled model completely on-device.
    // Kotlin-based: keep its kotlin-stdlib dependency (transitive alignment
    // below keeps every kotlin-stdlib* artifact on one version so the
    // duplicate-class check passes).
    implementation 'com.google.mediapipe:tasks-vision:1.0.0'

    // --- TensorFlow Lite interpreter for MobileFaceNet embeddings --------------
    // The 2.16.1 pairing ships Android natives (arm64/v7, x86/x64) + the public API.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-api:2.16.1'

    // --- AndroidX --------------------------------------------------------------
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.annotation:annotation:1.2.0'

    // --- CameraX (the official MediaPipe face_landmarker sample stack) --------
    // 1.5.3 is the current stable line that still works with compileSdk 35
    // (1.6.x requires compileSdk 36). CameraX owns the camera lifecycle, so the
    // app no longer opens/closes a Camera2 device by hand.
    def camerax_version = '1.5.3'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // --- Unit tests (run on the host JVM against pure-Java classes) ------------
    testImplementation 'junit:junit:4.13.2'

    // --- Phase 1 security core (Kotlin + Compose lockscreen) -------------------
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    // EncryptedSharedPreferences-backed PIN/seed storage (androidx security-crypto)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Room + SQLCipher: encrypted relational storage for people, groups and attendance.
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    // BiometricManager / BiometricPrompt for the biometric opt-in + unlock
    implementation 'androidx.biometric:biometric:1.1.0'

    // Instrumented Room/SQLCipher integration tests.
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

// kotlin-stdlib-jdk7/jdk8 content was merged into kotlin-stdlib in Kotlin 1.8;
// mixed transitive versions produce "Duplicate class kotlin.collections.jdk8…"
// errors. Pin every kotlin-stdlib* artifact to the version matching the Kotlin
// compiler above (2.0.21) so MediaPipe/TFLite transitives stay consistent and
// the Compose runtime sees the stdlib it was compiled against.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '2.0.21'
        }
    }
}

// Copy git-tracked model files (when present) into the app assets so they are
// bundled inside the APK. models/ is gitignored for the model binaries; this
// step makes a locally fetched model available to the running app.
task copyModels(type: Copy) {
    from modelDir
    into "$projectDir/src/main/assets"
    include '*.task', '*.tflite'
    onlyIf { modelDir.exists() }
}

preBuild.dependsOn copyModels
